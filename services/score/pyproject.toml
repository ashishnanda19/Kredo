[project]
name = "kredo-score"
version = "0.1.0"
description = "Risk engine and Aura score service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "redis>=5.2",
  "pyyaml>=6.0",
  "httpx>=0.28",
  "pyjwt>=2.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "hypothesis>=6.120", "ruff>=0.8", "pyarrow>=17"]
export = ["pyarrow>=17"]  # the training export only; not in the Docker image (`uv run --group export`)

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs Postgres and Redis (make up)"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608", "DTZ001"]
"alembic/**" = ["E501", "S608"]
"simulator/**" = ["S311", "S603", "S404"]  # seeded fake data; the bench starts its own API process
