name: score-service

on:
  push:
    paths: ["services/score/**", "lib/score/fixtures.json", "lib/score/ops-fixtures.json", ".github/workflows/score-service.yml"]
  pull_request:
    paths: ["services/score/**", "lib/score/fixtures.json", "lib/score/ops-fixtures.json", ".github/workflows/score-service.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/score
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kredo
          POSTGRES_PASSWORD: kredo
          POSTGRES_DB: kredo_score
        ports: ["55433:5432"]
        options: --health-cmd "pg_isready -U kredo" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["56380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.23"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run pytest
